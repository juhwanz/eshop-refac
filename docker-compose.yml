services:
  # 1. MariaDB (Main DB)
  mariadb:
    image: mariadb:11.8.6
    container_name: eshop-mariadb
    restart: always
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: eshop
      MARIADB_USER: ${DB_USERNAME:-eshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+09:00
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis (Cache & Distributed Lock)
  redis:
    image: redis:latest
    container_name: eshop-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Seoul

  # 3. Spring Boot Application (WAS)
  eshop-server:
    image: hongjuhwan/eshop-app:latest
    container_name: eshop-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      # application.yaml의 설정을 환경 변수로 덮어씌워 내부 컨테이너 통신을 연결합니다.
      SPRING_DATASOURCE_URL: "jdbc:mariadb://mariadb:3306/eshop"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-eshop}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mariadb-data:
