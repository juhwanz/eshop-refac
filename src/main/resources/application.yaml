
# 1. Common Settings

spring:
  application:
    name: eshop-refact

  datasource:
    hikari:   # HikariCP [DB 커넥션 풀 세팅] : 기본값 10개.
      maximum-pool-size: 20 # 스레드 수 고려해 넉넉히 20개
      minimum-idle: 10      # 항상 유지할 최소 연결 수.
      connection-timeout: 30000 # 30초 안에 여결 못 얻으면 에러 (데드락 방지)
      max-lifetime: 1800000   # 커넥션 최대 생존 시간 ( DB 생존시간 보다 짧게)
    url: jdbc:mysql://localhost:3306/eshop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD} # 환경변수 사용
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    # OSIV: 트랜잭션 범위 밖에서 DB 커넥션 점유 방지
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        # Batch Fetching: N+1 문제 해결을 위한 전역 설정
        default_batch_fetch_size: 100

jwt:
  secret: ${JWT_SECRET_KEY} # 환경변수 사용
  expiration-time: 86400000 # 24시간

management:
  endpoints:
    web:
      exposure:
        include: health    # 헬스 체크
        # info, prometheus #  모니터링 엔드포인트 노출.
        # /actuator/health로 답해 줌. -> 노출 최소.

app:
  order:
    lock:
      wait-time: 10 # 락 흭득 대기 시간
      lease-time: 3 # 락 점유 시간.
---

# 2. Local Profile (개발 환경)

spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: update # 개발 중에는 테이블 자동 변경 허용
    #show-sql: true     # 쿼리 로그 출력 O -> sysout으로 성능 저하 가능성
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug # SQL 쿼리를 로거를 통해 출력
    org.hibernate.type.descriptor.sql: trace # 바인딩 변수(? 값)까지 보고 싶을 때 (개발환경용)
    com.project.eshop_refact: debug # 내 프로젝트 로그 레벨

---

# 3. Prod Profile (운영 환경 시뮬레이션)

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate # 운영 중에는 스키마 변경 방지 (검증만 수행)
    show-sql: false      # 성능을 위해 쿼리 로그 출력 X
    properties:
      hibernate:
        format_sql: false