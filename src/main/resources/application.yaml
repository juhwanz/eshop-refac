
# 1. Common Settings
spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  application:
    name: eshop-refact

  datasource:
    hikari:
      # 현재 부하 테스트 기준값이며 운영 환경에서는 DB 용량과 트래픽에 맞춰 재검토합니다.
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 1000
      # MariaDB wait_timeout보다 짧게 유지해야 하는 커넥션 수명 상한입니다.
      max-lifetime: 1800000
    url: "jdbc:mariadb://localhost:${DB_PORT:3306}/eshop"
    username: ${DB_USERNAME:eshop}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    # 영속성 접근을 서비스 트랜잭션 안으로 제한합니다.
    open-in-view: false
    properties:
      hibernate:
        # 지연 로딩되는 연관관계를 최대 100개씩 IN 절로 묶어 조회합니다.
        default_batch_fetch_size: 100

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration-time: 86400000 # 24시간

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  queue:
    active-ttl: 10m
    promotion-size-per-product: 100
    product-scan-limit: 100
    schedule-delay-ms: 1000
    initial-delay-ms: 1000
    scheduler-lock-at-least: 900ms
    scheduler-lock-at-most: 30s
  security:
    login-lock:
      max-failures: 5 # 기존 연속 실패 임계치를 유지합니다.
      lock-duration: 15m # 영구 잠금 없이 반복 대입을 지연하는 초기 정책입니다.
  order:
    lock:
      wait-time: 10 # 대기열 병목 방지를 위한 분산 락 획득 최대 대기 시간 (Fail-Fast 유도)
---

# 2. Local Profile (개발 환경)

spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      file: docker-compose.dev.yml
      lifecycle-management: start-and-stop
  jpa:
    hibernate:
      ddl-auto: update
    #show-sql: true     # 쿼리 로그 출력 O -> sysout으로 성능 저하 가능성
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug # SQL 쿼리를 로거를 통해 출력
    org.hibernate.type.descriptor.sql: trace # 바인딩 변수(? 값)까지 보고 싶을 때 (개발환경용)
    com.project.eshop_refact: debug # 내 프로젝트 로그 레벨

---

# 3. Prod Profile (운영 환경 시뮬레이션)
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      # 실제 운영 데이터와 schema version 관리가 필요해지면 migration 도구를 재검토합니다.
      ddl-auto: update
    show-sql: false      # 성능을 위해 쿼리 로그 출력 X
    properties:
      hibernate:
        format_sql: false
