spring:

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      # 향후 Testcontainers 또는 Embedded Redis 도입을 위한 환경변수 처리
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
test:
  simulation:
    delay-ms: 50 # 0.05초 성능 지연 테스트용 (Performance / 실험 테스트 클래스에서만 활용)
jwt:
  # 임의의 값 (Base64 인코딩된 긴 문자열)
  secret: V2hhdGlzVGhlTWF0dGVyV2l0aFlouV2hhdGlzVGhlTWF0dGVyV2l0aFlouV2hhdGlzVGhlTWF0dGVyV2l0aFlou=
  expiration-time: 3600000