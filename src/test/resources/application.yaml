spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  data:
    redis:
      # 통합 테스트에서는 Testcontainers가 동적 host/port를 주입합니다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
test:
  simulation:
    delay-ms: 50 # 0.05초 성능 지연 테스트용 (Performance / 실험 테스트 클래스에서만 활용)
jwt:
  # 임의의 값 (Base64 인코딩된 긴 문자열)
  secret: V2hhdGlzVGhlTWF0dGVyV2l0aFlouV2hhdGlzVGhlTWF0dGVyV2l0aFlouV2hhdGlzVGhlTWF0dGVyV2l0aFlou=
  expiration-time: 3600000
