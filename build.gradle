plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.6' // 👈 버전 업그레이드 (중요)
}

group = 'com.demo'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

ext['testcontainers.version'] = '1.21.4'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

//에러 유발 가능성 있는 configurations 블록 삭제함
// configurations {
//    compileOnly {
//       extendsFrom annotationProcessor
//    }
// }

repositories {
	mavenCentral()
}

dependencies {
	// 1. Spring Boot Default
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// 2. Lombok (configurations 블록 없이도 잘 동작함)
	compileOnly 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 3. Database & Redis
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	// [중요] Redisson
	implementation 'org.redisson:redisson-spring-boot-starter:3.31.0'

	// 4. QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// 5. JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// 6. Swagger (SpringDoc)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// 7. Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mariadb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'

	// ShedLock Core
	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.13.0'
	// ShedLock Redis Provider (Redis를 락 저장소로 사용하기 위함)
	implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.13.0'

	// 모니터링을 위한 Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

}

// 기존 QueryDSL 설정 다 지우고 이걸로 대체
def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
	main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
	options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean.doLast {
	file(querydslDir).deleteDir()
}

tasks.named('test') {
	useJUnitPlatform()
	exclude '**/integration/**'
	exclude '**/stressTest/**'
	exclude '**/EshopRefactApplicationTests.class'
	exclude '**/OrderIdempotencyTest.class'
}

tasks.register('unitTest') {
	group = 'verification'
	description = '외부 Redis/MariaDB 없이 실행할 수 있는 빠른 테스트를 실행합니다.'
	dependsOn tasks.named('test')
}

tasks.register('integrationTest', Test) {
	group = 'verification'
	description = 'Testcontainers의 MariaDB와 Redis를 사용하는 통합·동시성 테스트를 실행합니다.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	include '**/integration/**'
	include '**/EshopRefactApplicationTests.class'
	include '**/OrderIdempotencyTest.class'
	exclude '**/integration/ProductDeepPaginationTest.class'
	shouldRunAfter tasks.named('test')
}

tasks.register('stressTest', Test) {
	group = 'verification'
	description = '로컬 MariaDB를 변경하거나 대량 데이터를 생성하는 테스트를 실행합니다.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	include '**/stressTest/**'
	include '**/integration/ProductDeepPaginationTest.class'
	shouldRunAfter tasks.named('integrationTest')

	doFirst {
		if (!project.hasProperty('allowStressTest')) {
			throw new GradleException('스트레스 테스트는 로컬 DB를 변경할 수 있습니다. 승인 후 -PallowStressTest를 추가하세요.')
		}
	}
}

tasks.register('verifyChange') {
	group = 'verification'
	description = '안전한 테스트와 실행 가능한 JAR 패키징을 검증합니다.'
	dependsOn tasks.named('unitTest')
	dependsOn tasks.named('bootJar')
}
